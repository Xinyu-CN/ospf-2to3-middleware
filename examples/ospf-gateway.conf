# Linux interface carrying all three protocol speakers.
interface=eth0

# OSPF Router ID and Area ID are IPv4-formatted 32-bit values.
router-id=192.0.2.1
area-id=0.0.0.0

# IPv6 source address is required for OSPFv3 checksum generation.
ipv6-source=fe80::1
v3-interface-id=1

# OSPFv2 Hello compatibility values.
v2-network-mask=255.255.255.0
hello-interval=10
dead-interval=40
